
name: ULTIMATE QWEN Data Collection

on:
  workflow_dispatch:

  push:
    branches:
      - main
    paths:
      - "scripts/normalize.py"
      - ".github/workflows/normalize.yml"

permissions:
  contents: read

concurrency:
  group: ultimate-qwen-collection
  cancel-in-progress: false

jobs:
  collect:
    name: Collect and Normalize
    runs-on: ubuntu-latest
    timeout-minutes: 360

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install datasets huggingface_hub pyarrow

      - name: Create directories
        run: |
          mkdir -p quarantine
          mkdir -p reports

      - name: Collect and normalize datasets
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          python -u scripts/normalize.py

      - name: Upload collection results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ultimate-qwen-collected-data
          path: |
            quarantine/
            reports/
          retention-days: 14
          compression-level: 0
          if-no-files-found: warn
