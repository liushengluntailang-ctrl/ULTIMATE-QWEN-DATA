
name: ULTIMATE QWEN Data Collection

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "Select operation"
        required: true
        type: choice
        options:
          - collect
          - upload
        default: collect

  push:
    branches:
      - main
    paths:
      - "scripts/normalize.py"
      - ".github/workflows/normalize.yml"

permissions:
  contents: read
  actions: read

concurrency:
  group: ultimate-qwen-collection
  cancel-in-progress: false

jobs:
  collect:
    name: Collect, Normalize and Validate
    if: github.event_name == 'push' || inputs.mode == 'collect'
    runs-on: ubuntu-latest
    timeout-minutes: 360

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install datasets huggingface_hub pyarrow teich

      - name: Create directories
        run: |
          mkdir -p quarantine
          mkdir -p reports
          mkdir -p training

      - name: Collect, normalize, validate and package
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          python -u scripts/normalize.py

      - name: Upload collection and validation results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ultimate-qwen-validated-data
          path: |
            quarantine/
            reports/
            training/
            ULTIMATE-QWEN-TRAINING.zip
          retention-days: 14
          compression-level: 0
          if-no-files-found: warn

  upload:
    name: Transfer Existing Artifact to Hugging Face
    if: github.event_name == 'workflow_dispatch' && inputs.mode == 'upload'
    runs-on: ubuntu-latest
    timeout-minutes: 360

    steps:
      - name: Download Existing Artifact
        uses: actions/download-artifact@v4
        with:
          name: ultimate-qwen-validated-data
          repository: liushengluntailang-ctrl/ULTIMATE-QWEN-DATA
          run-id: "43019372413"
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: ./existing-data

      - name: Install Hugging Face Hub
        run: |
          python -m pip install --upgrade "huggingface_hub[hf_xet]"

      - name: Verify Download
        run: |
          echo "Checking existing artifact..."
          find ./existing-data -type f
          test -n "$(find ./existing-data -type f -print -quit)"

      - name: Upload to Hugging Face
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          python - <<'PY'
          import os
          from huggingface_hub import HfApi

          token = os.environ["HF_TOKEN"]
          repo_id = "yagyu77/ultimate-qwen-dataset"

          api = HfApi(token=token)

          api.create_repo(
              repo_id=repo_id,
              repo_type="dataset",
              private=True,
              exist_ok=True
          )

          api.upload_folder(
              folder_path="./existing-data",
              repo_id=repo_id,
              repo_type="dataset",
              path_in_repo="",
              commit_message="Transfer existing validated QWEN artifact"
          )

          print("SUCCESS: Existing artifact uploaded.")
          print("Dataset:", repo_id)
          PY
